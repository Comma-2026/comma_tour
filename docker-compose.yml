# 개발용 OpenLDAP 서버.
#   - 도메인:        comma.tour  → base DN: dc=comma,dc=tour
#   - 관리자 DN:     cn=admin,dc=comma,dc=tour
#   - 관리자 비밀번호: admin (개발용)
#
# 실행:   docker compose up -d
# 중지:   docker compose down          (데이터 유지)
# 초기화: docker compose down -v       (볼륨까지 삭제)
services:
  backend:
    build:
      context: .
      target: backend
    container_name: comma_backend
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      FLASK_DEBUG: "true"
      SECRET_KEY: "dev-insecure-secret-change-me"
      LDAP_MODE: "real"
      LDAP_HOST: "openldap"
      LDAP_PORT: "389"
      LDAP_ADMIN_DN: "cn=admin,dc=comma,dc=tour"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_BASE_DN: "dc=comma,dc=tour"
      LDAP_USER_OU: "ou=users,dc=comma,dc=tour"
      SPOT_MODE: "mock"
      DIARY_MODE: "json"
      KMA_SERVICE_KEY: "dummy-development-key"
    ports:
      - "5000:5000"
    depends_on:
      - openldap

  frontend:
    build:
      context: .
      target: frontend
    container_name: comma_frontend
    environment:
      EXPO_PUBLIC_API_BASE_URL: "http://localhost:5000"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - backend
    stdin_open: true
    tty: true

  openldap:
    image: osixia/openldap:1.5.0
    container_name: comma_openldap
    environment:
      LDAP_ORGANISATION: "Comma Tour"
      LDAP_DOMAIN: "comma.tour"
      LDAP_ADMIN_PASSWORD: "admin"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d

  # 선택: 브라우저에서 디렉터리를 확인할 수 있는 관리 UI (http://localhost:8080)
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: comma_phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - openldap

volumes:
  ldap_data:
  ldap_config:
